name: import regressions

on:
  pull_request:
  push:
    branches: [main]

jobs:
  jest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy requires a stack name
        run: bash scripts/require-deploy-stack.test.sh
      - name: Worker import regressions
        working-directory: worker/ug-import
        run: |
          npm install
          npm test
      - name: Jam chord-sheet regressions
        working-directory: aws/lambdas
        run: |
          npm install
          npm test
      - name: Follow-me score follower
        working-directory: web
        run: node --experimental-strip-types --test core/follow.test.ts core/follow-fixtures.test.ts core/slideChunks.test.ts "app/(player)/capoPrefs.test.ts" app/api/follow/recording/plan.test.ts
