<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#e4bcbb" />
    <title>Offline · Oslyn Tabs</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg-top: #e4bcbb;
        --bg-bottom: #bb9bff;
        --ink: #2a1a4a;
        --button: #651fff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-top: #2a1a4a;
          --bg-bottom: #000000;
          --ink: #ffffff;
          --button: #7837ff;
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: linear-gradient(to bottom, var(--bg-top), var(--bg-bottom));
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
        text-align: center;
      }
      main { max-width: 28rem; }
      img { width: 96px; height: 96px; border-radius: 24px; }
      h1 { font-size: 1.75rem; margin: 16px 0 8px; }
      p { margin: 0 0 20px; line-height: 1.5; }
      button {
        appearance: none;
        border: 0;
        border-radius: 999px;
        background: var(--button);
        color: #fff;
        font: inherit;
        font-weight: 600;
        padding: 10px 18px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" width="96" height="96" />
      <h1>You're offline</h1>
      <p>Oslyn Tabs needs a connection for live jam sessions. Reconnect, then try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
